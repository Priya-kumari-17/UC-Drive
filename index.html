<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>UC Drive Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<!--
  UC Drive — Phase 1 MVP interactive prototype (v2)
  Source: "UC Drive Redesign — Product Requirements Document" v1.0, plus Priya's direction of 19 Oct 2026:
    · Black and white only, matching the UC app.
    · UC Drive tile sits next to InstaHelp on the UC home screen.
    · Three ways to book: In 1 hr (drag to choose hours), Later (date + time mandatory, drag hours),
      Multi-day (pick several dates, each with its own time and hours; more days can be added later).
    · Car make, model and transmission are mandatory in all three, so a driver with matching experience comes.
    · Repeat users can ask for the same driver again.

  CHANGES FROM THE PRD (by direction):
    C-1  "In 1 hr" adds instant booking. The PRD made Phase 1 pre-booking only (non-goal, S13) to protect fill rate;
         Ops can switch In 1 hr on or off per zone to manage that risk.
    C-2  Night-out return (FR-B-09) is not one of the three options in this version.
    C-3  Multi-day is a set of chosen dates, each with its own time and hours, instead of a weekday pattern.

  ASSUMPTIONS:
    A-1  Rates (open question Q1): 1 hr ₹279, +₹70 per extra hour, night band 10 PM–6 AM +₹60/hr,
         multi-day 10% off, ₹19 booking fee + 18% GST on the fee. Same rates for In 1 hr (no surge). Editable in Ops.
    A-2  Cancellation (Q7): full refund 4+ hours before start, 50% inside 4 hours, none after the driver arrives.
         In 1 hr bookings: free cancellation for 5 minutes after booking, then 50% until the driver arrives.
    A-3  Hours: 1–12. Later: at least 2 hours ahead, up to 14 days. In 1 hr: driver must reach within 60 minutes.
    A-4  Driver match uses car type (from the model) and transmission. A driver must be cleared for both.
    A-5  Zone caps are simulated: Friday and Saturday from 9 PM are full in every zone.
    A-6  Camera, GPS, SMS, payments and masked calls are simulated. Sample people and bookings are not real.
-->
<style>
/* Layout concept: a black-and-white workbench. Phone app in a device frame on the left,
   a requirement trace on the right. State is shown by fill, weight, outline and icons, never by hue. */
:root{
  --page:#F3F3F3;     /* workbench canvas */
  --surface:#FFFFFF;  /* app screens */
  --tile:#F2F2F2;     /* UC service tiles */
  --tile-2:#E8E8E8;
  --ink:#0B0B0B;      /* text, primary fill */
  --ink-2:#474747;
  --ink-3:#6B6B6B;
  --line:#E0E0E0;
  --line-2:#BDBDBD;
  --inv:#FFFFFF;      /* text on --ink fills */
  --chrome:#0B0B0B; --on-chrome:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.10);
  --f-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-s:10px; --r-m:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#050505; --surface:#121212; --tile:#1D1D1D; --tile-2:#272727; --ink:#F4F4F4; --ink-2:#C2C2C2; --ink-3:#9C9C9C;
  --line:#2B2B2B; --line-2:#4A4A4A; --inv:#0B0B0B; --chrome:#000000; --on-chrome:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#050505; --surface:#121212; --tile:#1D1D1D; --tile-2:#272727; --ink:#F4F4F4; --ink-2:#C2C2C2; --ink-3:#9C9C9C;
  --line:#2B2B2B; --line-2:#4A4A4A; --inv:#0B0B0B; --chrome:#000000; --on-chrome:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
h1,h2,h3{font-family:var(--f-ui);margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--chrome);color:var(--on-chrome);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;border-bottom:1px solid #222}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.brand small{display:block;font-weight:500;font-size:.75rem;opacity:.75}
.uc-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--inv);font-weight:800;font-size:.8rem;letter-spacing:.02em;flex:none}
.topbar .uc-mark{background:#fff;color:#0B0B0B}
.views{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;background:#1E1E1E;padding:4px;border-radius:12px}
.views button{min-height:44px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:#fff;font-weight:600;cursor:pointer}
.views button[aria-current="page"]{background:#fff;color:#0B0B0B}
.views button:focus-visible{outline-color:#fff}

/* workbench */
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.bench{display:grid;grid-template-columns:minmax(0,420px);justify-content:center}
.device{background:var(--surface);border-radius:34px;box-shadow:var(--shadow);border:8px solid #0B0B0B;overflow:hidden;position:relative;height:min(880px,calc(100dvh - 120px));min-height:640px;display:flex;flex-direction:column}
.device-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.device-scroll > .grow{flex:1}
.trace{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;min-width:0}
.panel h2{font-size:1.15rem;margin-bottom:8px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fr-list{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.fr-list li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:.92rem}
.fr-id{font-family:var(--f-mono);font-size:.78rem;font-weight:700;padding-top:2px}
.tip{margin-top:12px;background:var(--tile);border-radius:var(--r-s);padding:12px 14px;font-size:.92rem}
@media (max-width:900px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .trace{position:static}
  .device{border-radius:24px;border-width:6px;height:auto;min-height:0}
  .device-scroll{overflow:visible}
  .bar{position:static!important}
}
@media (max-width:520px){
  .wrap{padding-left:0;padding-right:0;padding-top:0}
  .device{border:0;border-radius:0;box-shadow:none}
  .trace{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* UC home */
.app-head{background:var(--ink);color:var(--inv);padding:14px 16px 18px}
.city{display:flex;align-items:center;gap:6px;font-weight:600}
.city select{background:transparent;border:0;color:var(--inv);font-weight:700;font-size:1rem;min-height:44px;cursor:pointer}
.city select option{color:#0B0B0B;background:#fff}
.hdr-btns{display:flex;gap:4px}
.hdr-btn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--inv);display:grid;place-items:center;cursor:pointer}
.hdr-btn:hover{background:color-mix(in srgb,currentColor 14%,transparent)}
.hdr-btn:focus-visible{outline-color:var(--inv)}
.menu{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.menu > li > button{display:flex;width:100%;align-items:center;gap:12px;min-height:54px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:0 4px;font-weight:600;color:var(--ink)}
.menu > li > button:hover{background:var(--tile)}
.menu .go{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600;font-size:.86rem}
.menu .sub{padding:12px 4px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.bal{display:grid;gap:2px}
.bal b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.search{margin-top:8px;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink-3);border-radius:12px;min-height:50px;padding:0 14px;border:0;width:100%;text-align:left;cursor:pointer;font-size:1.02rem}
.promos{display:grid;grid-auto-flow:column;grid-auto-columns:40%;gap:10px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
.promo{background:var(--surface);color:var(--ink);border-radius:14px;border:0;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:center;cursor:pointer}
.promo .art{height:84px;background:var(--tile);display:grid;place-items:center;position:relative;color:var(--ink-2)}
.promo b{font-weight:700;font-size:.92rem;padding:8px 6px}
.badge{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--inv);font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 7px}
.app-body{padding:18px 16px 24px;display:grid;gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px}
.svc{display:grid;gap:6px;justify-items:center;align-content:start;text-align:center;background:none;border:0;padding:0;cursor:pointer;font-size:.84rem;line-height:1.25;color:var(--ink)}
.svc .ic{position:relative;width:100%;aspect-ratio:1.35;max-width:100%;background:var(--tile);border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.svc .eta{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--ink);font-weight:700;font-size:.68rem;border:1px solid var(--line-2);border-radius:7px;padding:1px 6px;white-space:nowrap}
.svc.drive .ic{background:var(--ink);color:var(--inv)}
.svc.drive .eta{background:var(--surface);border-color:var(--ink)}
.svc .l{margin-top:6px}
.sec-title{font-size:1.15rem;font-weight:700}
.spot{background:var(--ink);color:var(--inv);border-radius:var(--r-m);padding:18px;display:grid;gap:10px;border:0;text-align:left;cursor:pointer;width:100%}
.spot h3{font-size:1.4rem;font-weight:800}
.spot p{opacity:.85;font-size:.92rem}

.bottom-nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.bottom-nav button{min-height:62px;border:0;background:none;display:grid;justify-items:center;align-content:center;gap:2px;font-size:.72rem;padding:0 2px;font-weight:600;color:var(--ink-3);cursor:pointer}
.bottom-nav button[aria-current="page"]{color:var(--ink);font-weight:800}
.upnext{display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 16px;text-align:left;width:100%;cursor:pointer;min-height:64px}
.upnext .clock{width:44px;height:44px;border-radius:10px;background:var(--tile);display:grid;place-items:center;flex:none}

.bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:3}
.bar h1{font-size:1.1rem;flex:1;min-width:0}
.icon-btn{min-width:44px;min-height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--tile)}

/* content */
.lead{font-size:1rem;color:var(--ink-2)}
.card{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;background:var(--surface)}
.card.inv{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.stack{display:grid;gap:12px}
.stack-s{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrapr{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.xs{font-size:.78rem}
.b{font-weight:700}
.hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.modes{display:grid;gap:10px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:16px;cursor:pointer;min-height:84px}
.mode:hover{border-color:var(--ink)}
.mode .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--tile);display:grid;place-items:center}
.mode h3{font-size:1.05rem}
.mode .go{margin-left:auto;flex:none}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--tile);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--inv)}

fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-weight:700;font-size:.98rem;margin-bottom:8px;display:flex;gap:6px;align-items:baseline}
.req{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
label.f{display:grid;gap:6px;font-weight:600;font-size:.92rem;min-width:0}
.hint{font-weight:400;color:var(--ink-3);font-size:.82rem}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{
  width:100%;min-height:48px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);padding:10px 12px;font-weight:500}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:0}
[aria-invalid="true"]{border:2px dashed var(--ink)!important}
.err{color:var(--ink);font-size:.86rem;font-weight:700;display:flex;gap:6px;align-items:flex-start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{border-top:1px solid var(--line);padding-top:16px}

/* drag (range) */
.drag{display:grid;gap:8px}
.drag-top{display:flex;align-items:baseline;justify-content:space-between}
.drag-val{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.drag-val small{font-size:1rem;font-weight:600;margin-left:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:grab;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(to right,var(--ink) 0 var(--fill,30%),var(--tile-2) var(--fill,30%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);margin-top:-11px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:var(--tile-2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:999px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--ink);outline-offset:3px}
input[type=range]:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.ticks{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-3);font-variant-numeric:tabular-nums;padding:0 4px}

/* car chips, radio cards */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;border:1.5px solid var(--line-2);border-radius:999px;background:var(--surface);padding:0 14px;font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.radio-card{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line-2);border-radius:12px;padding:12px;cursor:pointer;min-height:44px}
.radio-card:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.radio-card input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.same{display:flex;gap:12px;align-items:center;border:1.5px solid var(--ink);border-radius:var(--r-m);padding:12px;cursor:pointer}
.same:has(input:checked){background:var(--ink);color:var(--inv)}
.same input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.same:has(input:checked) .avatar{background:var(--inv);color:var(--ink)}
.same:has(input:checked) .muted{color:inherit;opacity:.8}

/* date picker */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:.7rem;text-align:center;color:var(--ink-3);font-weight:700;text-transform:uppercase}
.day{min-height:52px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--surface);display:grid;place-items:center;align-content:center;gap:0;cursor:pointer;font-weight:700;padding:2px}
.day small{font-size:.66rem;font-weight:600;color:var(--ink-3)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.day.blank{visibility:hidden}
.dayrow{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;display:grid;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;font-weight:700;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--ink);color:var(--inv)}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sos{background:var(--ink);color:var(--inv);min-height:58px;font-size:1.1rem;letter-spacing:.08em;border:3px solid var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.btn-link{background:none;border:0;color:var(--ink);font-weight:700;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;gap:4px}
.btn-sm{min-height:44px;padding:0 12px;font-size:.88rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.full{width:100%}
.footer-cta{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:6px;z-index:3}
.footer-cta .sum{display:flex;justify-content:space-between;font-size:.86rem;color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1.5px solid var(--ink);color:var(--ink);background:var(--surface)}
.pill.solid{background:var(--ink);color:var(--inv)}
.pill.dash{border-style:dashed;color:var(--ink-2);border-color:var(--ink-3)}
.pill.soft{border-color:var(--line-2);color:var(--ink-2)}

.notice{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.92rem;background:var(--tile)}
.notice.strong{background:var(--ink);color:var(--inv)}
.notice.outline{background:var(--surface);border:2px solid var(--ink)}
.notice svg{flex:none;margin-top:1px}

.price{display:grid;gap:8px}
.price .l{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.price .t{font-weight:800;font-size:1.1rem;border-top:1px dashed var(--line-2);padding-top:10px}

.driver{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:var(--inv);background:var(--ink)}
.avatar.sm{width:44px;height:44px;font-size:.9rem}
.verified{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.8rem}

const driver=id=>S.drivers.find(d=>d.id===id);
const addr=id=>S.addresses.find(a=>a.id===id);
const booking=id=>S.bookings.find(b=>b.id===id);
const cityLive=c=>LAUNCH.includes(c)&&!!S.config.cityOn[c];
const zoneLive=(c,z)=>cityLive(c)&&!!(S.config.zonesOn[c]||{})[z];
const instantLive=(c,z)=>zoneLive(c,z)&&!!(S.config.instantOn[c]||{})[z];
const isNight=h=>h>=22||h<6;
function atCap(ts){const d=new Date(ts);return (d.getDay()===5||d.getDay()===6)&&d.getHours()>=21;}
const overlaps=(a1,a2,b1,b2)=>a1<b2&&b1<a2;
function busy(dId,start,end,ignoreId){
 return S.bookings.some(b=>{ if(b.id===ignoreId||b.status!=='upcoming') return false; if(b.driverId!==dId&&b.backupId!==dId) return false;
  if(b.days) return b.days.some(x=>x.status==='scheduled'&&overlaps(start,end,combine(x.date,x.time),combine(x.date,x.time)+x.hours*H));
  return overlaps(start,end,b.start,b.end); });
}
/* FR-M-01 + car experience: verified, zone, transmission AND car type; instant also needs the driver online */
function qualifies(d,city,zone,trans,type){return d.status==='verified'&&d.city===city&&d.zones.includes(zone)&&d.skills.includes(trans)&&d.types.includes(type);}
function eligible(city,zone,trans,type,start,end,opts={}){
 return S.drivers.filter(d=>qualifies(d,city,zone,trans,type)&&(!opts.instant||d.online)&&!busy(d.id,start,end,opts.ignore)).sort((a,b)=>b.rating-a.rating||b.trips-a.trips);
}
function pastDrivers(){const ids=[...new Set(S.bookings.filter(b=>b.mine&&b.status==='completed'&&b.driverId).map(b=>b.driverId))];return ids.map(driver).filter(d=>d&&d.city===S.city);}
function lastTripWith(dId){return S.bookings.filter(b=>b.mine&&b.status==='completed'&&b.driverId===dId).sort((a,b)=>b.start-a.start)[0];}

function dayFare(start,h){const r=S.rates;const base=r.hourFirst+Math.max(0,h-1)*r.hourExtra;let nightH=0;for(let i=0;i<h;i++)if(isNight(new Date(start+i*H).getHours()))nightH++;return {base,nightH,night:nightH*r.nightPerHour};}
function draftStart(d){return d.mode==='now'?now()+etaMin(d)*MIN:d.mode==='later'?combine(d.date,d.time):(d.multi[0]?combine(d.multi[0].date,d.multi[0].time):null);}
function etaMin(d){return d._eta||35;}
/* FR-P-01/02 itemised */
function quote(d){
 const r=S.rates,lines=[];let sub=0,perDay=null,days=null;
 if(d.mode!=='multi'){const st=draftStart(d)||now();const f=dayFare(st,d.hours);lines.push([`Driver for ${hrs(d.hours)}`,f.base]);sub+=f.base;if(f.night){lines.push([`Night hours (${f.nightH} × ${inr(r.nightPerHour)})`,f.night]);sub+=f.night;}}
 else{days=d.multi.length;let total=0;d.multi.forEach(x=>{const f=dayFare(combine(x.date,x.time||'10:00'),x.hours);total+=f.base+f.night;});lines.push([`${days} days, ${d.multi.reduce((a,x)=>a+x.hours,0)} hrs in all`,total]);sub+=total;
  const disc=Math.round(total*r.multiDiscount/100);if(disc&&days>=2){lines.push([`Multi-day saving (${r.multiDiscount}%)`,-disc]);sub-=disc;}}
 const gst=Math.round(r.fee*.18);lines.push(['Booking fee',r.fee]);lines.push(['GST on booking fee (18%)',gst]);
 const total=sub+r.fee+gst;if(days)perDay=Math.round(total/days);return {lines,total,perDay,days};
}
function dayPrice(x){const f=dayFare(combine(x.date,x.time),x.hours);return Math.round((f.base+f.night)*(1-S.rates.multiDiscount/100));}

 }
 if(d.mode==='multi'){

 }
 if(d.pass==='other'){ if(!d.pName.trim()) e.pName='Enter the passenger’s name.'; if(!/^[6-9]\d{9}$/.test(d.pPhone.replace(/\D/g,''))) e.pPhone='Enter a 10-digit Indian mobile number.'; }
 return e;

/* FR-M-05 / FR-M-08 / same-driver check, before payment */
function check(d){
 const a=addr(d.addrId),zone=a.zone,type=typeOf(d.make,d.model),out={};
 const req=d.sameDriver?driver(d.sameDriver):null;
 if(d.mode==='now'){
  const list=eligible(S.city,zone,d.trans,type,now(),now()+(d.hours+1)*H,{instant:true});
  if(!list.length){ out.block={title:'No driver can reach you within an hour',text:`No online driver cleared for ${type} · ${d.trans.toLowerCase()} is free near ${zone} right now.`,later:true}; return out; }
  if(req && !list.find(x=>x.id===req.id)) out.req={text:`${req.name.split(' ')[0]} isn't available in the next hour.`,free:nextFree(req,d,zone,type)};
  out.eta=Math.min(55,25+Math.round(Math.random()*20)); d._eta=out.eta; return out;
 }
 const slots=d.mode==='later'?[{start:combine(d.date,d.time),hours:d.hours,label:fDT(combine(d.date,d.time))}]:d.multi.map(x=>({start:combine(x.date,x.time),hours:x.hours,label:fDate(combine(x.date,'00:00')),date:x.date}));
 const bad=slots.filter(s=>atCap(s.start)||!eligible(S.city,zone,d.trans,type,s.start,s.start+s.hours*H).length);
 if(bad.length){
  if(d.mode==='later'){ out.block={title:'This slot is fully booked',text:atCap(bad[0].start)?`Every verified driver for ${zone} is already booked then.`:`No driver cleared for ${type} · ${d.trans.toLowerCase()} is free in ${zone} then.`,options:nearest(d,zone,type)}; }
  else out.block={title:`${bad.length} of ${slots.length} dates are fully booked`,text:bad.map(s=>s.label).join(', ')+'.',dropDates:bad.map(s=>s.date)};
  return out;
 }
 if(req){
  const notFree=slots.filter(s=>!qualifies(req,S.city,zone,d.trans,type)||busy(req.id,s.start,s.start+s.hours*H));
  if(notFree.length) out.req={text:d.mode==='later'?`${req.name.split(' ')[0]} is busy then.`:`${req.name.split(' ')[0]} is busy on ${notFree.map(s=>s.label).join(', ')}. Another verified driver will cover ${notFree.length>1?'those days':'that day'}.`,free:d.mode==='later'?nextFree(req,d,zone,type):[]};
 }
 return out;
}
function nearest(d,zone,type){
 const st=combine(d.date,d.time),span=d.hours*H,c=[];
 const ok=ts=>ts>=now()+S.config.leadH*H&&ts<=now()+S.config.horizonD*DAY&&!atCap(ts)&&eligible(S.city,zone,d.trans,type,ts,ts+span).length;
 for(let k=1;k<=24&&c.length<4;k++)[st-k*30*MIN,st+k*30*MIN].forEach(ts=>{if(ok(ts))c.push(ts);});
 [1,2].forEach(n=>{if(ok(st+n*DAY))c.push(st+n*DAY);});
 return [...new Set(c)].sort((a,b)=>Math.abs(a-st)-Math.abs(b-st)).slice(0,4).sort((a,b)=>a-b);
}
function nextFree(req,d,zone,type){
 if(!qualifies(req,S.city,zone,d.trans,type)) return [];
 const base=d.mode==='now'?earliest():combine(d.date,d.time),span=d.hours*H,out=[];
 for(let k=0;k<96&&out.length<3;k++){const ts=base+k*30*MIN;if(ts<now()+S.config.leadH*H||atCap(ts))continue;const h=new Date(ts).getHours();if(h<6||h>21)continue;if(!busy(req.id,ts,ts+span))out.push(ts);}
 return out;
}

 const d=S.draft,a=addr(d.addrId),zone=a.zone,type=typeOf(d.make,d.model),q=quote(d);
 let b={id:newId(),mode:d.mode,customer:'You',mine:true,city:S.city,make:d.make,model:d.model,trans:d.trans,type,addrId:d.addrId,zone,
  passenger:d.pass==='other'?{self:false,name:d.pName.trim(),phone:d.pPhone.trim()}:{self:true},status:'upcoming',price:q,requested:d.sameDriver||null,
  pin:String(rnd(1000,9999)),timeline:[],tripPhase:null,startPhotos:[],returnPhotos:[],handoverOk:false,paidWith:S.payMethod||'UPI'};
 let list;
 if(d.mode==='now'){ b.start=now()+(d._eta||35)*MIN; b.dur=d.hours; b.end=b.start+d.hours*H; b.accepted=false; list=eligible(S.city,zone,d.trans,type,now(),b.end,{instant:true}); }
 else if(d.mode==='later'){ b.start=combine(d.date,d.time); b.dur=d.hours; b.end=b.start+d.hours*H; list=eligible(S.city,zone,d.trans,type,b.start,b.end); }
 else { b.days=d.multi.slice().sort((x,y)=>combine(x.date,x.time)-combine(y.date,y.time)).map(x=>({date:x.date,time:x.time,hours:x.hours,status:'scheduled',price:dayPrice(x)}));
  b.start=combine(b.days[0].date,b.days[0].time); b.dur=b.days[0].hours; b.end=b.start+b.dur*H;
  // FR-M-02: prefer one driver free on every chosen day
  const all=eligible(S.city,zone,d.trans,type,b.start,b.end); list=all.filter(dr=>b.days.every(x=>{const s=combine(x.date,x.time);return !busy(dr.id,s,s+x.hours*H);})); if(!list.length) list=all; }
 let primary=list[0];
 if(d.sameDriver){const p=list.find(x=>x.id===d.sameDriver);if(p)primary=p;}
 b.driverId=primary?primary.id:null;
 if(b.days) b.backupId=(list.find(x=>primary&&x.id!==primary.id)||{}).id||null;
 b.prefMet=d.sameDriver?!!(primary&&primary.id===d.sameDriver):null;
 stamp(b,`Paid ${inr(q.total)} via ${b.paidWith}. Booking confirmed.`);
 if(primary) stamp(b,`${primary.name} assigned (cleared for ${type} · ${d.trans}).${b.backupId?` ${driver(b.backupId).name} held as backup.`:''}`);
 if(d.sameDriver) stamp(b, b.prefMet?`You asked for ${driver(d.sameDriver).name} again.`:`You asked for ${driver(d.sameDriver).name}; not free, so ${primary?primary.name:'another driver'} was assigned.`);
 if(!b.passenger.self) stamp(b,`Trip details sent by SMS to ${b.passenger.name}.`);
 if(d.saveCar&&!S.myCars.find(c=>c.make===d.make&&c.model===d.model&&c.trans===d.trans)) S.myCars.push({id:'c'+(S.myCars.length+1),make:d.make,model:d.model,trans:d.trans});
 S.bookings.unshift(b); log('System',`${b.id} (${MODE_LABEL[b.mode]}) ${zone}, ${d.make} ${d.model}: ${primary?primary.name+' assigned':'unassigned'}${d.sameDriver?`; repeat request ${b.prefMet?'met':'not met'}`:''}.`);
 if(b.mode==='now'){ // driver accepts in the partner app; auto-accept after 4 s in the prototype
  setTimeout(()=>{const B=booking(b.id);if(B&&B.mode==='now'&&!B.accepted&&B.driverId&&B.status==='upcoming'){acceptInstant(B,true);render();}},4000); }
 return b;
}
function acceptInstant(b,auto){b.accepted=true;stamp(b,`${driver(b.driverId).name} accepted. Arriving by ${fTime(b.start)}.`);log(auto?'System':'Driver',`${b.id}: ${driver(b.driverId).name} accepted the In 1 hr trip.`);if(S.view==='customer')toast(`${driver(b.driverId).name.split(' ')[0]} is on the way`);}

/* FR-M-06 */
function driverDrops(b,why){
 const old=driver(b.driverId);stamp(b,`${old.name} ${why}.`);
 const list=eligible(b.city,b.zone,b.trans,b.type,b.mode==='now'?now():b.start,b.end,{instant:b.mode==='now',ignore:b.id}).filter(x=>x.id!==old.id&&x.id!==b.backupId);
 if(b.backupId){const bk=driver(b.backupId);b.driverId=bk.id;b.backupId=list[0]?list[0].id:null;stamp(b,`Backup ${bk.name} took over.`);log('System',`${b.id}: ${old.name} ${why}; backup ${bk.name} promoted.`);return bk;}
 if(list[0]){b.driverId=list[0].id;b.accepted=b.mode==='now'?false:b.accepted;stamp(b,`${list[0].name} reassigned automatically.`);log('System',`${b.id}: ${old.name} ${why}; reassigned to ${list[0].name}.`);
  if(b.mode==='now')setTimeout(()=>{const B=booking(b.id);if(B&&!B.accepted&&B.driverId){acceptInstant(B,true);render();}},4000);return list[0];}
 b.driverId=null;stamp(b,'No matching driver free yet. UC operations is on it.');log('System',`${b.id}: ${old.name} ${why}; no matching driver. Ops alerted.`);return null;
}

function refundFor(b,amount){
 if(b.tripPhase&&b.tripPhase!=='arriving')return {amt:0,why:'The driver has arrived, so this is no longer refundable.'};
 if(b.mode==='now'){ if(now()-(b.bookedAt||0)<5*MIN)return {amt:amount,why:'Within 5 minutes of booking: full refund.'}; return {amt:Math.round(amount/2),why:'In 1 hr booking, driver already on the way: 50% refund.'}; }
 if((b.start-now())/H>=S.config.cancelFreeH)return {amt:amount,why:`More than ${S.config.cancelFreeH} hours before start: full refund.`};
 return {amt:Math.round(amount/2),why:`Within ${S.config.cancelFreeH} hours of start: 50% refund.`};
}

let mapTimer=null,mapT=0,lastFix=0;
const mapSVG=()=>`<div class="map"><span class="live"><span class="dot"></span> Live · <span id="fix-age" class="num">updated just now</span></span>

 <path id="route" d="M40 185 L70 150 L190 150 L190 60 L300 60 L320 35" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="40" cy="185" r="7" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/><rect x="311" y="26" width="18" height="18" rx="3" fill="var(--ink)"/>

function startMap(b){stopMap();const path=$('#route'),dot=$('#carDot');if(!path||!dot)return;const L=path.getTotalLength();
 const place=()=>{const p=path.getPointAtLength(L*(mapT%1));dot.setAttribute('transform',`translate(${p.x} ${p.y})`);};place();lastFix=now();
 mapTimer=setInterval(()=>{const B=booking(b.id);if(!B||B.tripPhase!=='live'){stopMap();return;}mapT+=.012;place();B.elapsedMin=(B.elapsedMin||0)+1;
  if(Math.random()<.8)lastFix=now();const age=Math.round((now()-lastFix)/1000),el=$('#fix-age');if(el)el.textContent=age<=1?'updated just now':`updated ${age}s ago`;
  const ce=$('#elapsed');if(ce){const m=B.elapsedMin;ce.textContent=`${Math.floor(m/60)}:${pad(m%60)}`;}
  const ot=$('#ot');if(ot){const over=B.elapsedMin-B.dur*60;ot.hidden=!(over>0);if(over>0){const k=Math.ceil(over/S.config.overtimeBlock);ot.querySelector('span').textContent=`Overtime: ${k} × ${S.config.overtimeBlock} min = ${inr(k*S.rates.overtime)} so far`;}}},1000);}
function stopMap(){if(mapTimer){clearInterval(mapTimer);mapTimer=null;}}

  const tr=S.view==='customer'?TRACE[S.screen]||TRACE.home:{t:'Driver partner app',fr:[['In 1 hr','Instant requests to accept or decline; online switch'],['Car','"My cars" shows the car types and gearboxes you are cleared for'],['FR-M-07','See which customers asked for you by name'],['FR-D-01 to 05','Join: documents, checks, car experience, test, training'],['FR-S-03 to 06','SOS, six photos at start and return, PIN to start'],['FR-R-02','Rate the customer']],tip:'You are Ramesh Gowda. Book In 1 hr in the Customer app and switch here quickly to accept it yourself.'};

 const ns=$('.device-scroll');

 else{if(ns)ns.scrollTop=st;if(fid){const el=document.getElementById(fid);if(el)el.focus({preventScroll:true});}}
 if(S.modal){const sh=$('#sheet');if(sh&&!sh.contains(document.activeElement)){const f=sh.querySelector('button:not([disabled]),input,select,a');if(f)f.focus();}}
 if(S.view==='customer'&&S.screen==='trip'){const b=booking(S.current);if(b&&b.tripPhase==='live')startMap(b);}

/* ============ actions ============ */
function simDriver(b){const t=now();
 if(b.tripPhase==='arriving'){b.startPhotos=PHOTO_SET.map((_,i)=>t-(6-i)*20e3);b.tripPhase='handover';stamp(b,`${driver(b.driverId).name} arrived and took 6 start photos.`);toast('Driver arrived and took the start photos');}
 else if(b.tripPhase==='handover'&&b.handoverOk){b.tripPhase='live';b.elapsedMin=0;stamp(b,'PIN verified. Trip started.');log('System',`${b.id}: trip started.`);toast('Trip started');}
 else if(b.tripPhase==='live')endTrip(b,PHOTO_SET.map((_,i)=>t-(6-i)*15e3));}
function endTrip(b,photos){if(photos)b.returnPhotos=photos;const over=(b.elapsedMin||0)-b.dur*60;b.overtimeCharge=(b.overtimeCharge||0)+(over>0?Math.ceil(over/S.config.overtimeBlock)*S.rates.overtime:0);
 b.tripPhase='return';b.end=now();stamp(b,'Trip ended. Return photos taken. Family links expired.'+(over>0?` Overtime ${inr(Math.ceil(over/S.config.overtimeBlock)*S.rates.overtime)}.`:''));log('System',`${b.id}: trip ended.`);toast('Car returned. Check the return photos.');}
function finishTrip(b){
 if(b.days){const d=b.days.find(x=>x.status==='scheduled');if(d)d.status='done';}
 const rem=b.days?b.days.some(x=>x.status==='scheduled'):false;
 if(rem){b.lastDay={returnPhotos:b.returnPhotos};b.returnPhotos=[];b.startPhotos=[];b.handoverOk=false;b.tripPhase=null;const nx=b.days.find(x=>x.status==='scheduled');b.start=combine(nx.date,nx.time);b.dur=nx.hours;b.end=b.start+b.dur*H;}
 else{b.tripPhase='done';b.status='completed';}
}
function syncMultiStart(b){const nx=b.days.find(x=>x.status==='scheduled');if(nx){b.start=combine(nx.date,nx.time);b.dur=nx.hours;b.end=b.start+b.dur*H;}else b.status=b.days.some(x=>x.status==='done')?'completed':'cancelled';}

 'help-chat'(){toast('Support chat would open here. Average reply time: 2 min.');},
 cancel(){S.modal={type:'cancel'};render();},
 'do-cancel'(){const b=booking(S.current),r=refundFor(b,b.price.total+(b.extraPaid||0));b.status='cancelled';b.refund=r.amt;b.tripPhase=null;stamp(b,`Cancelled by you. ${inr(r.amt)} refund started.`);log('Customer',`${b.id} cancelled; refund ${inr(r.amt)}.`);S.modal=null;render();toast(`Cancelled. ${inr(r.amt)} will be refunded.`);},
 resched(){S.modal={type:'resched'};render();},
 'add-day'(){S.modal={type:'addday',date:'',time:''};render();},
 'day-move'(d){S.modal={type:'move',i:Number(d.i)};render();},
 'day-skip'(d){S.modal={type:'skip',i:Number(d.i)};render();},
 'do-skip'(){const b=booking(S.current),x=b.days[S.modal.i],ts=combine(x.date,x.time),r=refundFor({start:ts,mode:'later'},x.price||dayPrice(x));x.status='skipped';b.refund=(b.refund||0)+r.amt;stamp(b,`${fDate(ts)} skipped. ${inr(r.amt)} refund started.`);log('Customer',`${b.id}: skipped ${fDate(ts)}.`);syncMultiStart(b);S.modal=null;render();toast('Day skipped');},
 'do-resched'(){const b=booking(S.current),m=S.modal;const ds=$('#rs-date').value,tsS=$('#rs-time').value,ts=combine(ds,tsS);const h=m.type==='resched'?b.dur:(m.h||(m.type==='move'?b.days[m.i].hours:b.days.slice(-1)[0].hours));let err='';
  if(!ts)err='Choose a date and a start time.';else if(ts<now()+S.config.leadH*H)err=`Pick a time at least ${S.config.leadH} hours from now.`;else if(ts>now()+S.config.horizonD*DAY)err=`You can book up to ${S.config.horizonD} days ahead.`;else if(atCap(ts))err='That slot is fully booked. Try an earlier time or another day.';
  else if(m.type==='addday'&&b.days.some(x=>x.date===ds&&x.status==='scheduled'))err='You already have that day booked. Move it instead.';
  if(err){m.err=err;m.date=ds;m.time=tsS;render();return;}
  const dr=driver(b.driverId);
  const free=dId=>{ if(m.type==='move'){const x=b.days[m.i];const save=x.status;x.status='moving';const r=!busy(dId,ts,ts+h*H,null);x.status=save;return r;} return !busy(dId,ts,ts+h*H,m.type==='resched'?b.id:null); };
  if(!free(dr.id)){const alt=eligible(b.city,b.zone,b.trans,b.type,ts,ts+h*H,{ignore:b.id}).find(x=>free(x.id));if(!alt){m.err='No matching driver is free then. Try another time.';m.date=ds;m.time=tsS;render();return;}stamp(b,`${dr.name} isn't free at ${fDT(ts)}; ${alt.name} will drive${m.type==='resched'?'':' that day'}.`);if(m.type==='resched')b.driverId=alt.id;}
  if(m.type==='addday'){const nd={date:ds,time:tsS,hours:h,status:'scheduled',added:true};nd.price=dayPrice(nd);b.days.push(nd);b.days.sort((p,q)=>combine(p.date,p.time)-combine(q.date,q.time));b.extraPaid=(b.extraPaid||0)+nd.price;stamp(b,`Added ${fDate(ts)}, ${fTime(ts)} for ${hrs(h)}. Paid ${inr(nd.price)}.`);log('Customer',`${b.id}: added a day (${fDate(ts)}).`);syncMultiStart(b);toast('Day added');}
  else if(m.type==='move'){const x=b.days[m.i];stamp(b,`${fDate(combine(x.date,x.time))} moved to ${fDT(ts)}.`);x.date=ds;x.time=tsS;x.hours=h;x.price=dayPrice(x);b.days.sort((p,q)=>combine(p.date,p.time)-combine(q.date,q.time));syncMultiStart(b);toast('Day moved');}
  else{b.start=ts;b.end=ts+b.dur*H;stamp(b,`Rescheduled to ${fDT(ts)}. Price unchanged.`);log('Customer',`${b.id} rescheduled.`);toast('New time saved');}
  S.modal=null;render();},
 'fast-forward'(){const b=booking(S.current);b.tripPhase='arriving';stamp(b,`Trip day. ${driver(b.driverId).name} is on the way.`);go('trip',{id:b.id});},
 'drv-cancel'(){const b=booking(S.current),nd=driverDrops(b,'dropped out');render();toast(nd?`Your driver changed to ${nd.name}`:'Your driver dropped out. UC operations is finding a replacement.');},
 'sim-driver'(){simDriver(booking(S.current));render();},
 'confirm-handover'(){const c=$('#ho-check');if(!c||!c.checked){toast('Tick the box once you have checked the photos.');c&&c.focus();return;}const b=booking(S.current);b.handoverOk=true;stamp(b,'You confirmed the handover photos.');render();},
 'fam-add'(){const n=$('#fam-name').value.trim(),p=$('#fam-phone').value.replace(/\D/g,''),er=$('#fam-err');if(!n||!/^[6-9]\d{9}$/.test(p)){er.hidden=false;er.textContent=!n?'Enter their name.':'Enter a 10-digit Indian mobile number.';(!n?$('#fam-name'):$('#fam-phone')).focus();return;}S.family.push({name:n,phone:p.replace(/(\d{5})(\d{5})/,'$1 $2')});render();toast(`Tracking link sent to ${n}`);},
 'fam-del'(d){S.family.splice(Number(d.i),1);render();},
 sos(){S.modal={type:'sos'};render();},
 'do-sos'(){const b=booking(S.current);raiseSOS(b,'customer',S.offline);S.modal=S.offline?{type:'sos',offline:true}:{type:'sos',sent:now()};render();},
 'return-ok'(){const b=booking(S.current);stamp(b,'You confirmed the car came back fine.');finishTrip(b);S.rateDraft={stars:0,comment:''};S.screen='rate';render(true);},
 'return-flag'(){const b=booking(S.current);stamp(b,'You flagged damage at return.');finishTrip(b);S.claimDraft={part:'',desc:''};S.screen='claim';render(true);},
 'open-rate'(d){S.current=d.id;S.rateDraft={stars:0,comment:''};go('rate',{id:d.id});},
 'start-claim'(d){S.current=d.id;S.claimDraft={part:'',desc:''};go('claim',{id:d.id});},
 'open-claim'(d){S.current=d.id;go('claim',{id:d.id});},
 'submit-rate'(){const r=S.rateDraft,b=booking(S.current);if(!r.stars){const e=$('#rate-err');e.hidden=false;e.textContent='Choose a rating from 1 to 5 stars.';$('.stars input').focus();return;}
  b.rating=r.stars;const dr=driver(b.driverId);dr.rating=Math.round(((dr.rating*dr.trips)+r.stars)/(dr.trips+1)*100)/100;dr.trips++;stamp(b,`You rated ${dr.name} ${r.stars} ★.`);log('Customer',`${b.id}: rated ${dr.name} ${r.stars}★.`);applySuspend();S.history=[];S.screen='detail';render(true);toast('Thanks for rating');},
 'submit-claim'(){const f=S.claimDraft,b=booking(S.current),er=$('#claim-err');if(!f.part||f.desc.trim().length<10){er.hidden=false;er.textContent=!f.part?'Choose where the damage is.':'Describe the damage in a few words (at least 10 characters).';(!f.part?$('#cl-part'):$('#cl-desc')).focus();return;}
  if(!b.returnPhotos.length&&b.lastDay)b.returnPhotos=b.lastDay.returnPhotos;const c={id:'CLM-'+rnd(1100,9899),bookingId:b.id,part:f.part,desc:f.desc.trim(),status:'open',t:now()};S.claims.push(c);stamp(b,`Damage claim ${c.id} raised and sent to the insurer.`);log('System',`${c.id} sent to insurer for ${b.id}.`);render(true);toast('Claim '+c.id+' submitted');},
 /* partner */
 ptab(d){S.partnerTab=d.v;render();},
 'p-accept'(d){const b=booking(d.id);acceptInstant(b,false);render();toast('Accepted. Head to the pickup.');},
 'p-decline'(d){const b=booking(d.id),nd=driverDrops(b,'declined the In 1 hr request');render();toast(nd?`Passed to ${nd.name}`:'No other matching driver online. Ops alerted.');},
 'p-start-day'(d){const b=booking(d.id);b.tripPhase='arriving';stamp(b,`${driver(b.driverId).name} is on the way.`);render();},
 cap(d){const b=S.bookings.find(x=>x.driverId==='d1'&&x.tripPhase&&x.tripPhase!=='done');const list=d.kind==='start'?b.startPhotos:b.returnPhotos;list[Number(d.i)]=now();if(d.kind==='start'&&b.tripPhase==='arriving'){b.tripPhase='handover';stamp(b,`${driver(b.driverId).name} arrived and started the handover photos.`);}render();},
 'p-start'(){const b=S.bookings.find(x=>x.driverId==='d1'&&x.tripPhase==='handover'),v=$('#p-pin').value.trim(),er=$('#p-pin-err');if(v!==b.pin){er.hidden=false;er.textContent='That PIN doesn’t match. Ask the customer for the 4-digit PIN in their app.';$('#p-pin').focus();return;}b.tripPhase='live';b.elapsedMin=0;stamp(b,'PIN verified. Trip started.');log('System',`${b.id}: trip started.`);render();toast('Trip started');},
 'p-end'(){const b=S.bookings.find(x=>x.driverId==='d1'&&x.tripPhase==='live');endTrip(b);render();},
 'p-sos'(){const b=S.bookings.find(x=>x.driverId==='d1'&&x.tripPhase==='live');raiseSOS(b,'driver',false);render();toast('SOS sent to the UC safety desk');},
 'p-rate-cust'(d){const b=booking(d.id);b.custRated=Number($('#cr-'+d.id).value);const iss=$('#ci-'+d.id).value.trim();log('Driver',`${b.id}: rated customer ${b.custRated}★${iss?'; issue: '+iss:''}.`);render();toast('Feedback sent');},
 'docs-sample'(){S.applicant.docs={id:true,licence:true,photo:true};render();},
 bgv(){S.applicant.bgv='pending';log('System',`Background check started for ${S.applicant.name}.`);render();setTimeout(()=>{S.applicant.bgv='clear';log('Vendor',`Background check clear for ${S.applicant.name}.`);render();},1500);},
 activate(){const a=S.applicant;a.activated=true;S.drivers.push({id:'d99',name:a.name,city:'Bengaluru',zones:a.zones,skills:Object.keys(a.skills).filter(k=>a.skills[k]),types:Object.keys(a.types).filter(k=>a.types[k]),years:parseInt(a.years),rating:null,trips:0,status:'verified',online:true,since:'Oct 2026'});log('Ops',`${a.name} activated for ${Object.keys(a.types).filter(k=>a.types[k]).join(', ')}.`);render();toast(`${a.name} can now take trips`);},
 /* ops */
 otab(d){S.opsTab=d.v;render();},
 'ops-assign'(d){const b=booking(d.id),sel=$('#as-'+d.id);if(!sel.value)return;const prev=b.driverId;b.driverId=sel.value;if(b.mode==='now')b.accepted=true;stamp(b,`UC operations assigned ${driver(sel.value).name}.`);log('Ops (you)',`${b.id}: ${prev?'reassigned from '+driver(prev).name+' to':'assigned'} ${driver(sel.value).name}${sel.value===b.requested?' (requested driver)':''}.`);render();toast(`${driver(sel.value).name} assigned to ${b.id}`);},
 'ops-cancel'(d){S.pageModal={id:d.id};renderPageModal();},
 'do-ops-cancel'(){const b=booking(S.pageModal.id),r=$('#oc-reason').value.trim();if(!r){const e=$('#oc-err');e.hidden=false;e.textContent='Enter a reason. It goes in the audit log and to the customer.';$('#oc-reason').focus();return;}b.status='cancelled';b.refund=b.price.total;stamp(b,`Cancelled by UC operations: ${r}. Full refund.`);log('Ops (you)',`${b.id} cancelled: ${r}. Full refund.`);S.pageModal=null;renderPageModal();render();toast(b.id+' cancelled');},
 'close-page-modal'(){S.pageModal=null;renderPageModal();},
 'sos-ack'(d){sosSet(d.id,'acknowledged','Acknowledged by safety desk. Calling customer.');},
 'sos-esc'(d){sosSet(d.id,'escalated','Escalated to city safety lead and local emergency services.');},
 'sos-close'(d){sosSet(d.id,'closed','Closed. Customer confirmed safe.');},
 'claim-set'(d){const c=S.claims.find(x=>x.id===d.id);c.status=d.v;stamp(booking(c.bookingId),`Claim ${c.id}: ${claimLabel(d.v)}.`);log('Claims (you)',`${c.id} → ${claimLabel(d.v)}.`);render();},
 'set-susp'(){const v=Number($('#susp').value);if(!(v>=3&&v<=5)){toast('Enter a threshold between 3 and 5.');return;}S.config.suspendBelow=v;const n=applySuspend();log('Ops (you)',`Auto-suspend threshold set to ${v}.`);render();toast(n?`${n} driver${n>1?'s':''} suspended for review`:'Rule applied');},
 reinstate(d){const dr=driver(d.id);dr.status='verified';dr.note='';log('Ops (you)',`${dr.name} reinstated after review.`);render();},
 'save-rates'(){const out={};let bad=false;document.querySelectorAll('[data-rc]').forEach(i=>{const v=Number(i.value);if(i.value===''||!(v>=0)){bad=true;i.setAttribute('aria-invalid','true');}out[i.dataset.rc]=v;});
  const mx=Number($('#lim-max').value),ld=Number($('#lim-lead').value),e=$('#rc-err');
  if(bad||out.multiDiscount>50||!(mx>=2&&mx<=16)||!(ld>=1&&ld<=12)){e.hidden=false;e.textContent=bad?'Every rate needs a number of 0 or more.':out.multiDiscount>50?'Multi-day discount can be at most 50%.':'Max hours must be 2–16 and notice 1–12.';return;}
  Object.assign(S.rates,out);S.config.maxH=mx;S.config.leadH=ld;log('Ops (you)','Rate card and booking limits published.');render();toast('Published. New bookings use these now.');},
};
function applySuspend(){let n=0;S.drivers.forEach(d=>{if(d.status==='verified'&&d.rating!=null&&d.rating<S.config.suspendBelow){d.status='suspended';d.note='Rolling rating fell below threshold';d.online=false;n++;log('System',`${d.name} auto-suspended (rating ${d.rating}).`);}});return n;}
function raiseSOS(b,src,offline){const s={id:'SOS-'+rnd(100,999),bookingId:b.id,source:src,t:now(),status:'new',family:S.family.length?S.family.map(f=>f.name.split(' ')[0]).join(', '):'none',via:offline?'call':'app',log:[{t:now(),text:offline?'Call received from the customer’s registered number.':'Alert received with trip ID, live location and contacts.'}]};S.sos.push(s);stamp(b,`SOS raised by ${src}.`);log('System',`${s.id}: SOS from ${src} on ${b.id}.`);}
function sosSet(id,st,text){const s=S.sos.find(x=>x.id===id);s.status=st;s.log.push({t:now(),text});log('Safety desk (you)',`${s.id}: ${text}`);render();}
function renderPageModal(){const m=S.pageModal,host=$('#page-modal');if(!m){host.innerHTML='';return;}const b=booking(m.id);
 host.innerHTML=`<div class="page-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pm-h" id="psheet"><h2 id="pm-h">Cancel ${b.id}?</h2><p class="small">${esc(b.customer)} gets a full refund and a message with your reason.</p><label class="f" for="oc-reason">Reason<input type="text" id="oc-reason" placeholder="e.g. No luxury-cleared driver free in zone"></label><p class="err" id="oc-err" hidden></p><button class="btn btn-primary" data-act="do-ops-cancel">Cancel booking</button><button class="btn btn-ghost" data-act="close-page-modal">Keep it</button></div></div>`;$('#oc-reason').focus();}

/* ============ events ============ */
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;if(['LABEL','INPUT','SELECT'].includes(el.tagName))return;const fn=A[el.dataset.act];if(!fn)return;if(el.dataset.act==='scrim'){fn(el.dataset,el,ev);return;}ev.preventDefault();fn(el.dataset,el,ev);});
document.addEventListener('submit',ev=>ev.preventDefault());
function setPath(o,p,v){const k=p.split('.');for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;}
function refreshEst(){const el=$('#est');if(el&&S.draft&&(S.draft.mode!=='multi'||S.draft.multi.length))el.textContent=inr(quote(S.draft).total);}
function refreshAddPrice(){const el=$('#add-price'),m=S.modal;if(!el||!m||m.type!=='addday')return;const b=booking(S.current);const h=m.h||b.days.slice(-1)[0].hours;el.innerHTML=m.date&&m.time?`This day costs <b class="num">${inr(dayPrice({date:m.date,time:m.time,hours:h}))}</b> (multi-day rate). We'll ask ${esc(driver(b.driverId).name.split(' ')[0])} first.`:'Pick a date and time to see the price.';}
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.drag){const v=Number(t.value);t.style.setProperty('--fill',((v-S.config.minH)/(S.config.maxH-S.config.minH))*100+'%');t.setAttribute('aria-valuetext',hrs(v));const o=document.getElementById(t.id+'-out');if(o)o.innerHTML=`${v}<small>hr${v>1?'s':''}</small>`;
  if(t.dataset.drag==='hours')S.draft.hours=v;else if(t.dataset.drag==='multi')S.draft.multi[Number(t.dataset.i)].hours=v;else if(t.dataset.drag==='modal'){S.modal.h=v;refreshAddPrice();}refreshEst();return;}
 if(t.dataset.bind&&S.draft)setPath(S.draft,t.dataset.bind,t.value);
 if(t.hasAttribute('data-bind-rate'))S.rateDraft.comment=t.value;
 if(t.dataset.bindClaim)S.claimDraft[t.dataset.bindClaim]=t.value;});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.change;
 if(t.dataset.bind&&S.draft){setPath(S.draft,t.dataset.bind,t.value);if(['date','time'].includes(t.dataset.bind)){delete S.draft.errors[t.dataset.bind];refreshEst();}return;}
 if(t.dataset.mtime!=null){S.draft.multi[Number(t.dataset.mtime)].time=t.value;delete S.draft.errors['t'+t.dataset.mtime];refreshEst();return;}
 if(t.dataset.mbind&&S.modal){S.modal[t.dataset.mbind]=t.value;refreshAddPrice();return;}
 if(t.dataset.bindClaim){S.claimDraft[t.dataset.bindClaim]=t.value;return;}
 if(!k)return;const a=S.applicant;
 switch(k){
  case 'city':S.city=t.value;if(S.draft){const ad=S.addresses.find(x=>x.city===S.city);S.draft.addrId=ad&&ad.id;}render();toast(cityLive(S.city)?`UC Drive is live in ${S.city}`:`UC Drive isn't available in ${S.city} yet`);break;
  case 'make':S.draft.make=t.value;S.draft.model='';delete S.draft.errors.make;render();break;
  case 'model':S.draft.model=t.value;delete S.draft.errors.model;render();break;
  case 'same':S.draft.sameDriver=t.checked?t.value:'';render();break;
  case 'pm':S.payMethod=t.value;break;
  case 'offline':S.offline=t.checked;break;
  case 'stars':S.rateDraft.stars=Number(t.value);render();break;
  case 'avail':S.availability[t.dataset.k]=t.checked;break;
  case 'guar':S.guaranteed[t.dataset.k]=t.checked;toast(t.checked?'Opted in to the guaranteed-hours slot':'Opted out');break;
  case 'online':driver('d1').online=t.checked;log('Driver',`Ramesh Gowda ${t.checked?'went online':'went offline'} for In 1 hr trips.`);render();break;
  case 'doc':if(t.files&&t.files[0]){a.docs[t.dataset.k]=true;render();toast('Uploaded '+t.files[0].name);}break;
  case 'dtest':a.test=t.value;render();break;
  case 'train':a.training[t.dataset.k]=t.checked;render();break;
  case 'skill':a.skills[t.dataset.k]=t.checked;render();break;
  case 'ctype':a.types[t.dataset.k]=t.checked;render();break;
  case 'years':a.years=t.value;break;
  case 'opszone':S.opsZone=t.value;render();break;
  case 'opsmode':S.opsMode=t.value;render();break;
  case 'city-on':S.config.cityOn[t.dataset.c]=t.checked;log('Ops (you)',`UC Drive ${t.checked?'on':'off'} in ${t.dataset.c}.`);render();break;
  case 'zone-on':S.config.zonesOn[t.dataset.c][t.dataset.z]=t.checked;log('Ops (you)',`${t.dataset.z}: bookings ${t.checked?'on':'off'}.`);render();break;
  case 'instant-on':S.config.instantOn[t.dataset.c][t.dataset.z]=t.checked;log('Ops (you)',`${t.dataset.z}: In 1 hr ${t.checked?'on':'off'}.`);render();break;
 }});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'){if(S.pageModal){S.pageModal=null;renderPageModal();}else if(S.modal&&!S.modal.busy){S.modal=null;render();}}
 if(ev.key==='Tab'){const sh=$('#psheet')||$('#sheet');if(!sh)return;const f=[...sh.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,a[href]')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
render(false);
})();
</script>
